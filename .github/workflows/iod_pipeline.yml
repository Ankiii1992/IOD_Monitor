name: IOD Pipeline

on:
  schedule:
    - cron: '0 4 * * 2'   # Every Tuesday 04:00 UTC (09:30 IST)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to commit output files back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (for Cartopy)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            proj-data \
            proj-bin \
            libgdal-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run compute_iod.py
        run: python compute_iod.py

      - name: Run render_sst_map.py
        run: python render_sst_map.py

      - name: Commit output files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: update IOD data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
